name: Build and Release Nivalis

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --clean --name "Nivalis" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nivalis-windows
          path: dist/Nivalis.exe
          if-no-files-found: error

  build-linux-appimage:
    # Самая старая из поддерживаемых Ubuntu: AppImage, собранный на старом glibc,
    # запускается на всех более новых дистрибутивах (Debian/Ubuntu, Arch, Fedora, openSUSE...).
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system libraries for Qt (xcb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 libegl1 libdbus-1-3 file desktop-file-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="$(git rev-parse --short HEAD)"; fi
          PYTHON=python VERSION="$VERSION" ARCH=x86_64 bash packaging/linux/build-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nivalis-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux-appimage]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Nivalis.exe
            artifacts/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
